name: "branchMatchRegex"
description: "Check if the current branch matches a regex/wildcard pattern"
author: "IamPekka058 <59747867+IamPekka058@users.noreply.github.com>"

inputs:
  patterns:
    description: "The regex/wildcard patterns to match against the branch"
    required: false
    default: ""
  path:
    description: "The path or URL to the file containing the pattern"
    required: false
    default: ""
  failOnUnmatchedPattern:
    description: "Fail the action if the branch does not match the pattern"
    required: false
    default: "true"
  useWildcardPatterns:
    description: "Use wildcard patterns for branch matching instead of regex"
    required: false
    default: "false"
  useDefaultPatterns:
    description: "Use default patterns for branch matching"
    required: false
    default: "false"
  branch:
    description: "The branch to match against the pattern"
    required: true
    default: ${{ github.head_ref }}

runs:
  using: "composite"
  steps:
    - name: Run branchMatchRegex
      shell: bash
      env:
        INPUT_PATTERNS: ${{ inputs.patterns }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAILONUNMATCHEDPATTERN: ${{ inputs.failOnUnmatchedPattern }}
        INPUT_USEWILDCARDPATTERNS: ${{ inputs.useWildcardPatterns }}
        INPUT_USEDEFAULTPATTERNS: ${{ inputs.useDefaultPatterns }}
        INPUT_BRANCH: ${{ inputs.branch }}
        CGO_ENABLED: "0"
      run: |
        set -euo pipefail

        binary="$RUNNER_TEMP/branchmatchregex"
        if [ "$RUNNER_OS" = "Windows" ]; then
          binary="${binary}.exe"
        fi

        cd "$GITHUB_ACTION_PATH"
        go build -trimpath -o "$binary" .
        "$binary"

branding:
  icon: "check-circle"
  color: "blue"
