name: Test branchMatchRegex Action

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

env:
  IMAGE: branchmatchregex:test
  INPUT_BRANCH: "feature/test"
  INPUT_PATTERNS: ""
  INPUT_PATH: ""
  INPUT_FAILONUNMATCHEDPATTERN: "false"
  INPUT_COMMENTONUNMATCHEDPATTERN: "false"
  INPUT_COMMENT: ""
  INPUT_USEWILDCARDPATTERNS: "false"
  INPUT_USEDEFAULTPATTERNS: "false"

jobs:
  checks:
    name: Format, vet, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Test
        run: go test ./... -race -cover

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Test with single pattern
        env:
          INPUT_PATTERNS: ".*"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with list
        env:
          INPUT_PATTERNS: |
            - feature/*
            - fix/*
            - hotfix/*
            - docs/*
            - test/*
            - refactor/*
            - style/*
            - ci/*
            - perf/*
            - i18n/*
            - security/*
            - release/*
            - chore/*
            - test/*
            - renovate/*
            - dependabot/*
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with inline list
        env:
          INPUT_PATTERNS: >-
            ['feature/*', 'fix/*', 'hotfix/*', 'docs/*', 'test/*',
            'refactor/*', 'style/*', 'ci/*', 'perf/*', 'i18n/*', 'security/*',
            'release/*', 'chore/*', 'test/*', 'renovate/*, dependabot/*']
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with file
        env:
          INPUT_PATH: .github/branches.yml
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with default patterns
        env:
          INPUT_USEDEFAULTPATTERNS: "true"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with default patterns and explicit branch
        env:
          INPUT_USEDEFAULTPATTERNS: "true"
          INPUT_BRANCH: "fix/123"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with URL
        env:
          INPUT_PATH: "https://raw.githubusercontent.com/michisec/branchMatchRegex/main/assets/default-patterns.yml"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test unmatched pattern does not fail
        env:
          INPUT_PATTERNS: "never/.*"
          INPUT_FAILONUNMATCHEDPATTERN: "false"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test unmatched pattern fails when configured
        env:
          INPUT_PATTERNS: "never/.*"
          INPUT_FAILONUNMATCHEDPATTERN: "true"
        run: |
          if docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_COMMENTONUNMATCHEDPATTERN \
            -e INPUT_COMMENT \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"; then
            echo "::error::Expected the action to fail for an unmatched branch"
            exit 1
          fi
