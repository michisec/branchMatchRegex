name: Test branchMatchRegex Action

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

env:
  IMAGE: branchmatchregex:test
  INPUT_BRANCH: "feature/test"
  INPUT_PATTERNS: ""
  INPUT_PATH: ""
  INPUT_FAILONUNMATCHEDPATTERN: "true"
  INPUT_USEWILDCARDPATTERNS: "false"
  INPUT_USEDEFAULTPATTERNS: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Test with single pattern
        env:
          INPUT_PATTERNS: ".*"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with list
        env:
          INPUT_PATTERNS: |
            - feature/*
            - fix/*
            - hotfix/*
            - docs/*
            - test/*
            - refactor/*
            - style/*
            - ci/*
            - perf/*
            - i18n/*
            - security/*
            - release/*
            - chore/*
            - test/*
            - renovate/*
            - dependabot/*
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with inline list
        env:
          INPUT_PATTERNS: >-
            ['feature/*', 'fix/*', 'hotfix/*', 'docs/*', 'test/*',
            'refactor/*', 'style/*', 'ci/*', 'perf/*', 'i18n/*', 'security/*',
            'release/*', 'chore/*', 'test/*', 'renovate/*, dependabot/*']
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with file
        env:
          INPUT_PATH: .github/branches.yml
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with default patterns
        env:
          INPUT_USEDEFAULTPATTERNS: "true"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with default patterns and explicit branch
        env:
          INPUT_USEDEFAULTPATTERNS: "true"
          INPUT_BRANCH: "fix/123"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"

      - name: Test with URL
        env:
          INPUT_PATH: "https://raw.githubusercontent.com/IamPekka058/branchMatchRegex/main/assets/default-patterns.yml"
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -w /github/workspace \
            -e INPUT_PATTERNS \
            -e INPUT_PATH \
            -e INPUT_FAILONUNMATCHEDPATTERN \
            -e INPUT_USEWILDCARDPATTERNS \
            -e INPUT_USEDEFAULTPATTERNS \
            -e INPUT_BRANCH \
            "$IMAGE"
