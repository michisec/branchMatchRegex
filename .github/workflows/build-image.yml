name: Build Action Image

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version to tag the image with (e.g. 3.1.0)."
        required: true
        type: string
    outputs:
      digest:
        description: "Digest of the pushed image."
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if the image already exists
        id: exists
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if docker pull "ghcr.io/michisec/branchmatchregex:${VERSION}" >/dev/null; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/michisec/branchmatchregex
          # Version tags are immutable, so a release can always be pulled by
          # its exact version. "latest" is mutable and tracks the most recent
          # build. Image tags omit the "v" prefix to match action.yml.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest

      - name: Build and push
        id: build
        if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
