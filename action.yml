name: "branchMatchRegex"
description: "Check if the current branch matches a regex/wildcard pattern"
author: "michisec <59747867+michisec@users.noreply.github.com>"

inputs:
  patterns:
    description: "The regex/wildcard patterns to match against the branch"
    required: false
    default: ""
  path:
    description: "The path or URL to the file containing the pattern"
    required: false
    default: ""
  failOnUnmatchedPattern:
    description: "Fail the action if the branch does not match the pattern"
    required: false
    default: "false"
  commentOnUnmatchedPattern:
    description: "Post a comment on the pull request if the branch does not match the pattern"
    required: false
    default: "false"
  comment:
    description: "Comment template used when the branch does not match. Supports {branch} and {patterns}. Empty uses the default text."
    required: false
    default: ""
  github-token:
    description: "GitHub token used to post the comment"
    required: false
    default: ${{ github.token }}
  useWildcardPatterns:
    description: "Use wildcard patterns for branch matching instead of regex"
    required: false
    default: "false"
  useDefaultPatterns:
    description: "Use default patterns for branch matching"
    required: false
    default: "false"
  branch:
    description: "The branch to match against the pattern"
    required: true
    default: ${{ github.head_ref }}

runs:
  using: "docker"
  # Updated automatically by release.yml to the exact version being released.
  image: "docker://ghcr.io/michisec/branchmatchregex:3.0.0-rc4@sha256:4103e601325ca98781cd64d671e57139714a4a9e484f2a4db93bdb9473beb6b9"

branding:
  icon: "check-circle"
  color: "blue"
